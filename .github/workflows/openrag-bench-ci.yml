name: OpenRAG Bench CI
on:
  push:
    branches: [main, feature/openrag-bench]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: openrag-bench examples/retrieval_results.json --k 2 --output report.json
      - name: Validate JSON report
        run: python -c "import json; r=json.load(open('report.json')); assert r['count']==2 and 'ndcg_at_k' in r['metrics']"
