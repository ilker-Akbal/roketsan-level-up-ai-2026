name: Real FAISS retrieval evaluated by OpenRAG Bench

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "practice/llm/local-rag/faiss_search.py"
      - "practice/llm/local-rag/retrieval_core.py"
      - "practice/llm/local-rag/openrag_bench_eval.py"
      - "practice/llm/local-rag/openrag_golden.json"
      - "practice/llm/local-rag/openrag_guard_policy.json"
      - "tests/test_openrag_faiss.py"
      - ".github/workflows/openrag-bench-faiss.yml"
  push:
    branches: [main]
    paths:
      - "practice/llm/local-rag/faiss_search.py"
      - "practice/llm/local-rag/retrieval_core.py"
      - "practice/llm/local-rag/openrag_bench_eval.py"
      - "practice/llm/local-rag/openrag_golden.json"
      - "practice/llm/local-rag/openrag_guard_policy.json"
      - "tests/test_openrag_faiss.py"
      - ".github/workflows/openrag-bench-faiss.yml"

permissions:
  contents: read

jobs:
  real-faiss:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Standard-library adapter and fixture contracts
        run: python -m unittest discover -s tests -v
      - name: Install CPU-only embedding runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "sentence-transformers==5.1.1" "transformers==4.57.1" "faiss-cpu==1.12.0"
      - name: Install released OpenRAG Bench v0.6.0 wheel (downstream dependency)
        run: |
          python -m pip install https://github.com/ilker-Akbal/openrag-bench/releases/download/v0.6.0/openrag_bench-0.6.0-py3-none-any.whl
          openrag-bench --help
      - name: Execute original FAISS search, Capture and Guard Replay
        run: |
          python practice/llm/local-rag/openrag_bench_eval.py --output-dir reports/gha-openrag
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("reports/gha-openrag")
          summary = json.loads((folder / "summary.json").read_text())
          baseline = json.loads((folder / "baseline-observed.json").read_text())
          candidate = json.loads((folder / "candidate-observed.json").read_text())
          assert summary["query_count"] == len(baseline) == len(candidate) == 6
          assert summary["corpus_document_count"] == 6
          assert summary["guard_passed"] and summary["replay_exit_code"] == 0
          assert all(isinstance(r["retrieved_ids"], list) for r in candidate)
          assert any(r["retrieved_ids"] for r in candidate)
          assert (folder / "guard.html").is_file()
          print("Real model and FAISS produced observed rankings; release guard passed.")
          PY
      - name: Upload redacted guard report and aggregate-only measurements
        uses: actions/upload-artifact@v4
        with:
          name: openrag-faiss-firstparty-summary
          path: |
            reports/gha-openrag/summary.json
            reports/gha-openrag/guard.json
            reports/gha-openrag/guard.html
          retention-days: 14
          if-no-files-found: error
